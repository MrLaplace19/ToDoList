services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.Jenkins
    image: todoapp-jenkins:go1.27.1
    container_name: todoapp-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
volumes:
  jenkins_home: