            $ref: '#/definitions/github_com_MrLaplace19_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удаляет задачу по идентификатору.
      parameters:
      - description: Идентификатор
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Удалено, тело ответа отсутствует
        "400":
          description: Некорректные параметры запроса
          schema:
