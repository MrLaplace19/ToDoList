paths:
  /statistics:
    get:
      description: 'Возвращает статистику задач. Фильтры необязательны: user_id —
        автор, from — начало периода включительно, to — конец периода исключительно;
        даты в формате YYYY-MM-DD.'
      parameters:
      - description: Идентификатор автора задач
        in: query
        name: user_id
        type: integer
      - description: Начало периода включительно (YYYY-MM-DD)
        format: date
        in: query
        name: from
        type: string
      - description: Конец периода исключительно (YYYY-MM-DD)
        format: date
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Некорректные параметры запроса
          schema:
            $ref: '#/definitions/github_com_MrLaplace19_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_MrLaplace19_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получить статистику задач
      tags:
      - statistics
  /tasks:
    get:
      description: Возвращает список задач с необязательной пагинацией.
      parameters:
      - description: Максимальное количество записей
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Количество пропускаемых записей
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.DTOTaskResponse'
            type: array
        "400":
