            $ref: '#/definitions/github_com_MrLaplace19_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получить задачи
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создаёт задачу для пользователя author_id.
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешный ответ
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Некорректные параметры запроса
          schema:
