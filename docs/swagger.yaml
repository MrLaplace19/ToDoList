        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_MrLaplace19_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получить задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Изменяет только переданные поля. title и completed не допускают
        null; description можно очистить значением null.
      parameters:
      - description: Идентификатор
        in: path
