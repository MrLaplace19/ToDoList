services:
  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=app/out/logs
      - POSTGRES_HOST=postgres-app
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_TIMEOUT=10s
    ports:
      - "5050:5050"
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    restart: always
  postgres-app:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  migrate-app:
    image: migrate/migrate:v4.19.1
    container_name: todoapp-env-migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: forward-app
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres-app:5432
    ports:
      - "127.0.0.1:5432:5432"
  
  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.27.2-alpine3.24
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@latest
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code
    